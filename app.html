      <!-- ANALYTICS SECTION -->

      <a href="#sales" class="nav-item" data-view="sales">
        <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="1" x2="12" y2="23"></line>

      <a href="#customers" class="nav-item" data-view="customers">

      <a href="#insights" class="nav-item" data-view="insights">

          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>Insights</span>
      </a>

      <!-- DATA SECTION -->
      <div class="nav-section-label">DATA</div>

    <div class="sidebar-footer">
      <div class="text-mono text-muted" style="font-size: 10px;">ECOMLYTICS v1.0.0</div>
      <div class="text-muted" style="font-size: 11px;">Production Workspace</div>
    </div>
  </aside>

  <!-- MAIN VIEWPORT -->
  <div class="app-main">
    <!-- Topbar -->
    <header class="app-topbar">
      <div class="topbar-left">
        <button type="button" class="mobile-sidebar-toggle" aria-label="Toggle menu">☰</button>
        <h1 class="page-title" id="topbar-page-title">OVERVIEW</h1>
      </div>

      <div class="topbar-right">
        <!-- Backend Connection Pill -->
        <div class="connection-pill" id="backend-connection-badge">
          <span class="connection-dot offline" id="status-dot-indicator"></span>
          <span id="status-text-indicator">CHECKING API...</span>
        </div>

        <!-- Global Refresh Button -->
        <button type="button" class="btn btn-secondary btn-sm" id="global-sync-btn" title="Sync & Refresh Backend Data">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span>SYNC</span>
        </button>

        <a href="#settings" class="btn btn-ghost btn-sm" style="font-family: var(--font-mono); font-size: 11px;">
          STORE OWNER
        </a>
      </div>
    </header>

    <!-- Content Workspace Views -->
    <main class="app-content">
      <!-- 1. OVERVIEW VIEW -->
      <section id="view-overview" class="app-view active">
        <!-- Rendered by js/dashboard.js -->
      </section>

      <!-- 2. SALES VIEW -->
      <section id="view-sales" class="app-view">
        <!-- Rendered by js/sales.js -->
      </section>

      <!-- 3. PRODUCTS VIEW -->
      <section id="view-products" class="app-view">
        <!-- Rendered by js/products.js -->
      </section>

      <!-- 4. CUSTOMERS VIEW -->
      <section id="view-customers" class="app-view">
        <!-- Rendered by js/customers.js -->
      </section>

      <!-- 5. FUNNEL VIEW -->
      <section id="view-funnel" class="app-view">
        <!-- Rendered by js/funnel.js -->
      </section>

      <!-- 6. INSIGHTS VIEW -->
      <section id="view-insights" class="app-view">
        <!-- Rendered by js/insights.js -->
      </section>

      <!-- 7. DATA SOURCES VIEW -->
      <section id="view-data-sources" class="app-view">
        <!-- Rendered by js/dataSources.js -->
      </section>

      <!-- 8. SETTINGS VIEW -->
      <section id="view-settings" class="app-view">
        <!-- Rendered by js/settings.js -->
      </section>
    </main>
  </div>

  <!-- Centralized Script Pipeline -->
  <script src="js/config.js"></script>
  <script src="js/telemetry.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/sales.js"></script>
  <script src="js/products.js"></script>
  <script src="js/customers.js"></script>
  <script src="js/funnel.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/dataSources.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
